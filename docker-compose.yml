services:
  reliability-control-plane:
    build: .
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 20s
      timeout: 3s
      retries: 3
