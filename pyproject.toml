[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reliability-control-plane"
version = "1.0.0"
description = "Explainable telemetry correlation and policy-as-code for reliable distributed systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Amandeep Singh", email = "amandeep.dev.eu@gmail.com" }
]
keywords = [
  "observability",
  "reliability-engineering",
  "fastapi",
  "telecom",
  "incident-correlation",
  "policy-as-code",
  "prometheus"
]
dependencies = [
  "fastapi>=0.115,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1"
]

[project.scripts]
reliability-control-plane = "reliability_control_plane.cli:main"
rcp = "reliability_control_plane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=reliability_control_plane --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["reliability_control_plane"]
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:"
]
