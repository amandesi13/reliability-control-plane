name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test with coverage gate
        run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build image
        run: docker build -t reliability-control-plane:ci .
      - name: Smoke test container
        run: |
          docker run -d --name rcp -p 8080:8080 reliability-control-plane:ci
          for attempt in {1..20}; do
            curl --fail http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs rcp
          exit 1
